name: test-laravel-react

x-backend-runtime: &backend-runtime
  image: test-laravel-react/backend:dev
  env_file:
    - ../envs/.env.dev
  volumes:
    - ../apps/backend:/app
    - backend_vendor:/app/vendor
  restart: unless-stopped

x-backend-environment: &backend-environment
  FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}

x-backend-process: &backend-process
  <<: *backend-runtime
  environment:
    <<: *backend-environment
    RUN_MIGRATIONS: "false"
  healthcheck:
    disable: true
  depends_on:
    backend:
      condition: service_healthy

services:
  backend:
    <<: *backend-runtime
    build:
      context: ../apps/backend
      dockerfile: ../../infrastructure/backend/Dockerfile
      additional_contexts:
        infra: ./backend
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ../apps/backend:/app
      - backend_vendor:/app/vendor
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  queue:
    <<: *backend-process
    command: ["php", "artisan", "queue:listen", "redis", "--queue=default", "--tries=3", "--backoff=10", "--timeout=90"]

  queue-imports:
    <<: *backend-process
    command: ["php", "artisan", "queue:listen", "imports", "--queue=imports", "--tries=1", "--timeout=900"]

  scheduler:
    <<: *backend-process
    command: ["php", "artisan", "schedule:work"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    env_file:
      - ../envs/.env.dev
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

volumes:
  backend_vendor:
  frontend_node_modules:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:
  mailpit_data:
